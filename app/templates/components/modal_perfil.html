<div id="modal-configuracion" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
  <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl border border-slate-200">
    
    <!-- Encabezado -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
      <div class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-xl bg-blue-800 text-white font-black flex items-center justify-center text-sm shadow">
          IE
        </div>
        <div>
          <h3 class="text-base font-extrabold text-slate-900">Configuración Institucional</h3>
          <p class="text-xs text-slate-500">Personaliza la identidad y el contexto pedagógico de tu colegio</p>
        </div>
      </div>
      <button onclick="document.getElementById('modal-configuracion').remove()" class="text-slate-400 hover:text-slate-600 transition p-1 rounded-lg">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Formulario HTMX -->
    <form hx-post="/guardar-perfil" hx-target="#sidebar-perfil-container" hx-swap="outerHTML" onsubmit="document.getElementById('modal-configuracion').remove()" class="space-y-3.5 text-xs">
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nombre de la I.E.</label>
          <input type="text" name="nombre_ie" value="{{ perfil.nombre_ie }}" required class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">UGEL / DRE</label>
          <input type="text" name="ugel" value="{{ perfil.ugel }}" required class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Lema Institucional</label>
        <input type="text" name="lema" value="{{ perfil.lema or '' }}" placeholder="Ej. Disciplina, Estudio y Superación" class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nombre del Docente</label>
          <input type="text" name="nombre_docente" value="{{ perfil.nombre_docente }}" required class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Área Curricular</label>
          <input type="text" name="area_curricular" value="{{ perfil.area_curricular }}" required class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Grado y Sección</label>
        <input type="text" name="grado_seccion" value="{{ perfil.grado_seccion }}" required class="w-full rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none">
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Directiva / Enfoque Institucional (System Prompt Particular)</label>
        <textarea name="enfoque_institucional" rows="2" class="w-full resize-none rounded-xl border border-slate-300 p-2 text-slate-900 focus:border-blue-700 focus:outline-none" placeholder="Instrucciones para la IA: metodologías requeridas, enfoque ambiental, PEI del colegio...">{{ perfil.enfoque_institucional or '' }}</textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="document.getElementById('modal-configuracion').remove()" class="rounded-xl px-4 py-2 font-bold text-slate-600 hover:bg-slate-100 transition">
          Cancelar
        </button>
        <button type="submit" class="rounded-xl bg-blue-800 px-5 py-2 font-extrabold text-white shadow hover:bg-blue-900 transition">
          Guardar Cambios
        </button>
      </div>
    </form>

  </div>
</div>
